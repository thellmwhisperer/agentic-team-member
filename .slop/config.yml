# What the slop gate measures in this repository.
#
# Two duplication scopes, measured independently so production code cannot hide
# inside the test scope. Production is every Go file that is not a test.
schema: 1

detector:
  name: jscpd
  version: "4.2.5" # must match the detector linked into the binary

defaults:
  format: go
  mode: mild
  min_lines: 5
  min_tokens: 50

global_ignore:
  - "**/.git/**"
  - "**/.tmp/**"
  - "**/.worktree/**"
  - "**/.worktrees/**"
  - "**/.workspace/**"
  - "**/__pycache__/**"
  - "**/.claude/**"
  - "targets/**"

scopes:
  go_production:
    scan_path: .
    pattern: "{cmd,internal}/**/*.go"
    ignore:
      - "**/*_test.go"

  go_tests:
    scan_path: .
    pattern: "{cmd,internal}/**/*_test.go"
