incident:
  pattern: Handling for an input shape no caller produces.
  what_went_wrong: >
    deliver() turns a relative origin URL into an absolute path. No ATM target has a relative origin.
    It appeared in the hand-made PR 96 and came back in ATM's PR 101; ponytail-review flagged it.
  root_cause: Both authors guarded a case they imagined instead of one they had seen.
  rule_established: Delivery uses the source repo's origin URL as is; the resolver goes in the ponytail cleanup.
  evidence:
