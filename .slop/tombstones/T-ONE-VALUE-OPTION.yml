schema: 1
id: T-ONE-VALUE-OPTION
status: accepted
category: alien_code
title: --deliver is an option whose only accepted value is none
created_at: 2026-10-05
incident:
  pattern: A choice-typed option with a single choice, read back as a double negative.
  what_went_wrong: >
    After the reviewer removed the redundant "no-mistakes" value, --deliver kept choices=["none"] and
    callers test args.deliver != "none". A boolean --no-deliver says the same. Flagged by ponytail-review.
  root_cause: The option was shrunk by deleting a value instead of reshaping it.
  rule_established: An option with one meaningful state is a boolean flag.
  evidence:
    - family: speculative_feature
      example: "parser.add_argument('--deliver', choices=['none'])"
      artifact: agentic_tdd_runner/harness_worker.py
match:
  family: speculative_feature
  artifact: agentic_tdd_runner/harness_worker.py
