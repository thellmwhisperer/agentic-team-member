schema: 1
id: T-UNTRACKED-CONFIG-COPY
status: accepted
category: alien_code
title: Delivery copies an ignored .no-mistakes.yaml into the clone without proof it is read
created_at: 2026-10-05
incident:
  pattern: A feature built on an unverified assumption about another tool.
  what_went_wrong: >
    deliver() copies the source repo's .no-mistakes.yaml into the clone when the clone lacks it and hides
    it from git. Nobody checked that no-mistakes reads an untracked config from the invoking clone; the
    config this repo uses is tracked anyway. Issue 99 asked for it because its author (the CoS) assumed it.
  root_cause: The requirement itself was speculative and nobody verified it before building it.
  rule_established: Requirements about another tool's behaviour are verified against that tool before they reach an issue.
  evidence:
    - family: speculative_feature
      example: "if config_src.is_file() and not config_dst.exists(): shutil.copy2(...); .git/info/exclude"
      artifact: agentic_tdd_runner/harness_worker.py
match:
  family: speculative_feature
  artifact: agentic_tdd_runner/harness_worker.py
