schema: 1
id: T-SPECULATIVE-BRANCH-UUID
status: accepted
category: alien_code
title: Review agent added a uuid suffix to delivery branch names that are unique by construction
created_at: 2026-10-05
incident:
  pattern: >
    Code and a test added to guard against a failure the design already rules
    out: a random suffix on a name that is unique by construction, justified by
    a concurrency case that cannot happen.
  what_went_wrong: >
    On 5-oct-2026 the no-mistakes review step appended uuid4().hex to the
    delivery branch name atm/<slug>-<timestamp> and added a test for
    "concurrent deliveries", twice, in PR 96 and in PR 101. Both were reverted.
  root_cause: >
    The reviewer treats every name as a collision risk. It did not weigh that
    each ATM run works in its own clone and that the name already carries a
    timestamp to the second, so two deliveries cannot share a branch.
  rule_established: >
    Delivery branch names stay atm/<slug>-<timestamp> with no random suffix.
    Review instructions in .no-mistakes.yaml tell the reviewer to report a
    speculative hardening as a note and change nothing. A reviewer commit is
    read before any merge.
  evidence:
    - family: speculative_hardening
      example: 'f"atm/{slug}-{datetime.now().strftime(...)}-{uuid.uuid4().hex}" in deliver(), PR 101 commit 3b97887, reverted in 52b7028'
      artifact: agentic_tdd_runner/harness_worker.py
match:
  family: speculative_hardening
  artifact: agentic_tdd_runner/harness_worker.py
