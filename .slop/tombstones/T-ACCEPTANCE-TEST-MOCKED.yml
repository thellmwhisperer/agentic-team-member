title: Test step rewrote a 9-line acceptance test into 60 lines with 20 monkeypatches
created_at: 2026-10-05
incident:
  pattern: A simple behavioural test replaced by one that patches the internals it is meant to check.
  what_went_wrong: >
    On PR 109 the no-mistakes test step replaced the source-scanning key test with a TrackedDict harness
    that monkeypatched twenty functions of environment, quality and harness_worker. Any rename breaks it.
    Reverted in 56ee7cd.
  root_cause: The test agent chased precision and paid for it with coupling to private names.
  rule_established: Acceptance tests drive the code through its inputs; patching the module's own internals is rejected.
  evidence:
    - family: mock_heavy_test
      example: "no-mistakes(test): Test de claves verifica lecturas ejecutables del worker (c15996d)"
      artifact: tests/test_config.py
