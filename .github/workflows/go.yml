name: Go

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Starts on every PR so "Go checks" is always reported; the Go jobs run only for Go changes.
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.detect.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/changed-areas.sh "$BASE_SHA"

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Experiment for #398: Windows only, with Defender exclusions. Not for merge.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # ponytail: golangci-lint is pinned here; bump it with .golangci.yml when a new linter is wanted.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0

      - name: Install make on Windows
        if: runner.os == 'Windows'
        run: choco install make --no-progress

      # Same step as no-mistakes' ci.yml: Defender scans every process spawn and temp file the tests make.
      - name: Exclude build and test trees from Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, (go env GOCACHE), (go env GOMODCACHE), (go env GOROOT)) | Where-Object { $_ } | Sort-Object -Unique
            Add-MpPreference -ExclusionPath $paths -ErrorAction Stop
            Add-MpPreference -ExclusionProcess 'go.exe', 'git.exe' -ErrorAction Stop
            Write-Host "Defender exclusions added for: $($paths -join ', ')"
          } catch {
            Write-Host "::warning::Defender exclusions unavailable: $_"
          }

      - name: Test
        run: make test

      - name: Lint
        run: make lint

  summary:
    name: Go checks
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci-summary.sh "${{ needs.changes.result }}" "${{ needs.test.result }}"
