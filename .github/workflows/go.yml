name: Go

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Starts on every PR so "Go checks" is always reported; the Go jobs run only for Go changes.
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.detect.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/changed-areas.sh "$BASE_SHA"

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        # macOS splits internal/run in 3 parallel shards: run serially it took 674 s there (PR 518).
        # Shard 0 runs every other package and the lint.
        include:
          - { os: ubuntu-latest, shard: all }
          - { os: macos-latest, shard: 0 }
          - { os: macos-latest, shard: 1 }
          - { os: macos-latest, shard: 2 }
          - { os: macos-latest, shard: 3 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # ponytail: golangci-lint is pinned here; bump it with .golangci.yml when a new linter is wanted.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0

      - name: Test
        if: matrix.shard == 'all'
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            GOCOVERDIR="$(mktemp -d "${RUNNER_TEMP}/atm-cover.XXXXXX")"
            export GOCOVERDIR
            echo "GOCOVERDIR=$GOCOVERDIR" >> "$GITHUB_ENV"
            echo "cover-main: GOCOVERDIR=$GOCOVERDIR"
          fi
          make test

      - name: Test (shard)
        if: matrix.shard != 'all'
        run: |
          if [ "${{ matrix.shard }}" = 0 ]; then
            go list ./... | grep -v '/internal/run$' | xargs go test -timeout 30m
          else
            # Each shard runs its third as 3 processes, one per runner core: serially the slowest took 401 s.
            go test -list . ./internal/run | grep '^Test' > "$RUNNER_TEMP/names"
            pids=
            for r in 0 3 6; do
              names=$(awk "NR % 9 == (${{ matrix.shard }} + $r) % 9" "$RUNNER_TEMP/names" | paste -sd '|' -)
              go test -timeout 30m -run "^(${names})\$" ./internal/run &
              pids="$pids $!"
            done
            status=0
            for p in $pids; do wait "$p" || status=1; done
            exit $status
          fi

      - name: Lint
        if: matrix.shard == 'all' || matrix.shard == 0
        run: make lint

      - name: Keep the end-to-end coverage profile
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest'
        run: |
          go tool covdata textfmt -i="$GOCOVERDIR" -o cover-main.profile
          go tool covdata func -i="$GOCOVERDIR" > cover-main.func.txt

      - name: Upload the end-to-end coverage profile
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: cover-main-${{ github.sha }}
          path: |
            cover-main.profile
            cover-main.func.txt
          retention-days: 90

  summary:
    name: Go checks
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci-summary.sh "${{ needs.changes.result }}" "${{ needs.test.result }}"
