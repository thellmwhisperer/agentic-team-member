name: Go

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Starts on every PR so "Go checks" is always reported; the Go jobs run only for Go changes.
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.detect.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/changed-areas.sh "$BASE_SHA"

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Experiment for #398, not for merge: Windows only, internal/run split in 3 parallel shards, the rest in shard 0.
        os: [windows-latest]
        shard: [0, 1, 2, 3]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # ponytail: golangci-lint is pinned here; bump it with .golangci.yml when a new linter is wanted.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0

      - name: Install make on Windows
        if: runner.os == 'Windows'
        run: choco install make --no-progress

      - name: Test
        shell: bash
        run: |
          if [ "${{ matrix.shard }}" = 0 ]; then
            go test -timeout 30m $(go list ./... | grep -v '/internal/run$')
          else
            names=$(go test -list . ./internal/run | grep '^Test' | awk "NR % 3 == ${{ matrix.shard }} % 3" | paste -sd '|' -)
            echo "shard ${{ matrix.shard }}: $(echo "$names" | tr '|' '\n' | wc -l) tests"
            go test -timeout 30m -run "^(${names})\$" ./internal/run
          fi

  summary:
    name: Go checks
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci-summary.sh "${{ needs.changes.result }}" "${{ needs.test.result }}"
