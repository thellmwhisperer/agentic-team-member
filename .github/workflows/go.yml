name: Go

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - 'Makefile'
      - '.github/workflows/go.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  # Starts on every PR so "Go checks" is always reported; the Go jobs run only for Go changes.
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ github.event_name == 'push' || steps.filter.outputs.go == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - 'Makefile'
              - '.github/workflows/go.yml'

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # ponytail: golangci-lint is pinned here; bump it with .golangci.yml when a new linter is wanted.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0

      - name: Install make on Windows
        if: runner.os == 'Windows'
        run: choco install make --no-progress

      - name: Test
        run: make test

      - name: Lint
        run: make lint

  summary:
    name: Go checks
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci-summary.sh "${{ needs.changes.result }}" "${{ needs.test.result }}"
