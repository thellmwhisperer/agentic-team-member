name: PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Starts on every PR so "Python checks" is always reported; the tests run only for Python changes.
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.detect.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/changed-areas.sh "$BASE_SHA"

  test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install uv -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

  summary:
    name: Python checks
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci-summary.sh "${{ needs.changes.result }}" "${{ needs.test.result }}"
