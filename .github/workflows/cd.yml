name: CD

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install 'pytest>=9.0,<10' 'requests>=2.31,<3'

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Verify production config loads
        run: python -c "from agentic_tdd_runner.config import load_config; load_config('config/agent.toml'); print('OK')"
