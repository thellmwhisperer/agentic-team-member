name: CD

on:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.detect.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE_SHA: ${{ github.event.before }}
        run: scripts/changed-areas.sh "$BASE_SHA"

  test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install uv -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Verify production config loads
        run: python -c "from agentic_tdd_runner.config import load_config; load_config('config/agent.toml'); print('OK')"
