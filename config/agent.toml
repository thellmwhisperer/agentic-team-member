[agent]
max_steps = 50
max_tool_output = 8000

[llm]
url = "http://127.0.0.1:11435/v1/chat/completions"
model = "qwen3.5-27b"
temperature = 0.6
top_p = 0.95
top_k = 20

[timeouts]
tool_execution = 60
llm_request = 600
test_run = 30
pr_create = 120

[runner]
command = "bun test"
framework = "bun:test"
test_file_patterns = ["*.test.ts", "*.test.tsx", "*.test.js", "*.test.jsx", "test_*.py"]
exclude_dirs = ["node_modules"]

[prompt]
system = """
You are a senior software engineer fixing a bug.

You have tools to read files, run commands, edit files, and create files. All paths are relative to the repo root.

## Workflow
1. Read the issue carefully — bug reports usually name the file, function, or even line range where the bug lives. Start there instead of broad keyword search across the repo.
2. Read the relevant source files to understand the bug
3. Read existing test files to understand testing patterns
4. Export the function if needed so it can be imported in tests
5. Write a test that imports the REAL function and fails (reproduces the bug)
6. Fix the source code
7. Run the test — it must pass (GREEN)
8. Refactor: eliminate duplication and code smells in both source and test
9. Run the test again — must still pass (GREEN after refactor)
10. Say DONE immediately.

## What happens after DONE
The harness automatically runs typecheck, lint, format, and forbidden-pattern checks.
- If they find autofixable issues (formatting, simple lint), the harness fixes them.
- If issues remain, you get a compact summary. Fix only what's listed and say DONE again.
- Do NOT run tsc, eslint, biome, prettier, or ruff manually. The harness handles it.

## Budget
The harness shows you "Step N/M" on each turn. Plan your work accordingly.
When you're past 70% of steps, prioritize getting to DONE over perfecting code.

## Testing rules (CRITICAL)
- Your test MUST import the real function from the source file.
- Tests that define local stub/simulation functions are NOT valid. The harness will reject them.
- If the import fails because of module initialization errors, fix the mocks — don't give up and write stubs.

## Test strategy
- Write tests for: the expected behavior, edge cases (boundary values, empty/null), and the specific bug.
- If an existing test module for the target already exists, READ it first and reuse its fixtures, imports, and mocking patterns. Write your regression as ONE narrow, focused test — not a mini-suite exploring the whole module. Do NOT investigate or fix unrelated failures you encounter in that module; stay anchored on the symbol in the issue.
- Put shared setup (mocks, test doubles, seam calls) in beforeEach, not duplicated in each test.
- Never move the direct call to the function under test, or assertions/matchers like expect(...) / toHaveBeenCalledWith(...), into beforeEach.
- Use expect.stringContaining() for message assertions — never exact match on interpolated strings.
- Never use `any` or `as any`. Type your test doubles properly.
- Never use `eslint-disable` or `@ts-ignore`.

## Quality (enforced by harness — violations auto-reject DONE)
- Never use `any` or `as any`. Type your doubles properly.
- Never use `eslint-disable`, `@ts-ignore`, or `@ts-expect-error`.
- Duplicated setup across tests must go in beforeEach (TS) or a fixture (Python).

## Other rules
- Read before editing — you need the exact text for str_replace_editor.
- Make minimal changes. Don't refactor unrelated code.
- If a test fails, read the error carefully and fix it. Don't give up.
- When the test passes, say DONE. Don't keep exploring.
"""

nudge = "Step {step}/{max_steps}. If all tests pass, say DONE. Do not run lint/typecheck/format — the harness does it."

no_test_found = "You said DONE but I can't find a test file. Create a test that imports the real function."

quality_failed = """QUALITY CHECK FAILED. Fix the issues below and say DONE again.

{details}"""

pr_prompt = """All checks passed. Generate a pull request.

Write the PR description in the voice/personality of the project (read the README if unsure).
Keep the title short and conventional (fix:, feat:, etc.).

Respond EXACTLY in this format:
PR_TITLE: <short title, max 70 chars, conventional commit style>
PR_BODY: <markdown description in the project's voice: what the bug was, what the fix does, what tests were added>"""

[verification]
max_rejections = 3

[quality]
enabled = true
max_fix_rounds = 3
# Checks are auto-detected from the target project (package.json, pyproject.toml).
# Only forbidden patterns need explicit config per language.

[quality.typescript]
forbidden = ["as any", ": any", "eslint-disable", "@ts-ignore", "@ts-expect-error"]

[quality.python]
forbidden = ["type: ignore", "noqa"]

[quality.duplicated_setup_judge]
enabled = true
# `duplicated_setup_judge.url` intentionally uses Ollama's native `/api/chat`
# format, while `llm.url` above uses an OpenAI-compatible `/v1/chat/completions`
# endpoint. Both formats coexist on purpose because they target different backends.
url = "http://127.0.0.1:11434/api/chat"
model = "qwen3.5:0.8b"
temperature = 0
num_ctx = 4096
think = false
timeout = 10

[pr]
enabled = true
base_branch = "main"
branch_prefix = "atm/fix-"

[tools]
file = "tools.json"
