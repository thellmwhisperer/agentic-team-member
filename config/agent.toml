[timeouts]
tool_execution = 60
test_run = 30

[runner]
# Optional. Leave blank to use target-repo runner bootstrap facts and language plugins.
command = ""
framework = ""
# False means target-repo bootstrap facts override stale config values.
# Set true only when the configured runner is intentionally authoritative.
override_detected = false
test_file_patterns = []

[environment]
install = "auto" # auto | always | never
require_clean = true
run_typecheck = true
timeout = 300

[runs]
# One subdirectory per run: report.json, worker-*.jsonl, briefs, delivery-output.txt, command.txt.
# `~` is expanded; must be absolute. --artifact-dir overrides it for one run.
dir = "~/.atm/runs"

[monitor]
# Harness worker: a shell line run at every step start and end, with ATM_LABEL, ATM_STEP,
# ATM_STATE (started | passed | failed), ATM_DURATION and ATM_REPORT in the environment.
# Output discarded, exit code ignored; the shell times out after 5 s.
# Empty means stdout must be a terminal, or the worker refuses to start (exit 2).
command = ""

[delivery]
# Harness worker: a shell line run in the clone after a green verdict and the ponytail pass, with any
# remaining work committed and origin set. ATM_TITLE, ATM_ISSUE (empty with --issue-file), ATM_BRANCH,
# ATM_CLONE, ATM_REPORT and ATM_PONYTAIL (kept cut findings, or empty) are in its environment.
# Non-zero exit is worker exit 4. Empty skips delivery.
command = 'no-mistakes init && no-mistakes axi run --intent "$ATM_TITLE" ${ATM_ISSUE:+--closes "$ATM_ISSUE"} --wait 2h'
# The target's lint, a shell line every ponytail cut must pass. Empty means none.
lint_command = ""

[prompt]
quality_failed = """QUALITY CHECK FAILED. Fix the issues below and say DONE again.

{details}"""

[quality]
enabled = true
# Checks are auto-detected from the target project (package.json, pyproject.toml).
# Only forbidden patterns need explicit config per language.

[quality.typescript]
forbidden = ["as any", "as unknown as", "as never", "{} as", ": any", "eslint-disable", "@ts-ignore", "@ts-expect-error"]

[quality.python]
forbidden = ["type: ignore", "noqa"]

[quality.duplicated_setup_judge]
enabled = true
# Ollama's native `/api/chat` format, not an OpenAI-compatible endpoint.
url = "http://127.0.0.1:11434/api/chat"
model = "gemma4:e2b"
temperature = 0
num_ctx = 4096
think = false
timeout = 10
