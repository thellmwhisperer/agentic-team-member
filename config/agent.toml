# Worker config for `python3 -m agentic_tdd_runner.harness_worker --config ...`.
# Every key here is read by the code. For scripts/atm-run.py, copy this file to
# config/agent.<repo>.local.toml and add a [launch] table (see README).

[timeouts]
test_run = 30         # seconds for one test file in the red/green and follow-up checks
tool_execution = 60   # seconds for each quality tool; environment prep falls back to it

[runner]
# Optional. Leave blank to use the runner detected in the target repo.
command = ""          # e.g. "go test {test_dir}" or "python3 -m pytest"; {test_file} and {test_dir} are filled in
framework = ""
# False means the detected runner wins over a stale command above.
# Set true only when the configured runner is intentionally authoritative.
override_detected = false
test_file_patterns = []  # file-name globs for test files, e.g. ["*_test.go"]; when set, they replace the built-in name rule

[environment]
install = "auto"      # auto | always | never: install JavaScript dependencies in the clone
require_clean = true  # refuse a clone with uncommitted changes
run_typecheck = true  # run the typecheck (package.json script or tsc) during JavaScript prep
timeout = 300         # seconds for each prep step, and for the full test and typecheck commands

[prompt]
quality_failed = """QUALITY CHECK FAILED. Fix the issues below.

{details}"""

[quality]
enabled = true
# Linters and formatters are detected from the target project (package.json, pyproject.toml).
# Forbidden patterns are per language; [quality.go] works the same way for Go repositories.

[quality.typescript]
forbidden = ["as any", "as unknown as", "as never", "{} as", ": any", "eslint-disable", "@ts-ignore", "@ts-expect-error"]

[quality.python]
forbidden = ["type: ignore", "noqa"]

[quality.duplicated_setup_judge]
# A small local model (Ollama's native /api/chat) decides whether ambiguous repeated
# test lines are duplicated setup. If it is unreachable, the line is not reported.
enabled = true
url = "http://127.0.0.1:11434/api/chat"
model = "gemma4:e2b"
temperature = 0
num_ctx = 4096
think = false
timeout = 10

[tools]
path_dirs = []        # extra directories put on PATH for test and quality commands

[harness_worker]
max_units = 3         # longest follow-up chain, including the first unit; --max-units overrides it

[follow_ups.judge]
enabled = false       # TypeSafe Jev judge before a follow-up is chained; needs TYPESAFE_API_KEY or api_key_file
model = "jev-latest"  # TypeSafe model name
threshold = 0.6       # "serves the issue" probability below which the follow-up is not chained
api_key_file = "~/.config/typesafe/api_key"  # read when TYPESAFE_API_KEY is not set
timeout = 30          # seconds for the judge call
