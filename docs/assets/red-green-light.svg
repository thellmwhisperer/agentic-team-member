<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 215" width="900" height="215" role="img" aria-label="Red/green proof for fix and hotfix tasks. ATM sets aside changes to files already in the base, while keeping the test and newly added files: the test must fail. ATM brings the changes back: the same test must pass. A test that passes without the fix, or fails with it, fails the run. The agent's own claim is not asked.">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#59636e"/></marker></defs>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2328">
<text x="450" y="18" text-anchor="middle" font-weight="600">Fix and hotfix tasks</text>
<rect x="10" y="30" width="130" height="70" rx="6" fill="#fde9c9" stroke="#b7791f" stroke-width="2" stroke-dasharray="6 3"/><text x="75.0" y="52" text-anchor="middle" font-weight="600">Agent's work</text><text x="75.0" y="69" text-anchor="middle" font-size="11" fill="#59636e">the fix + its test</text>
<rect x="162" y="30" width="130" height="70" rx="6" fill="#dbe7f3" stroke="#5b7fa6"/><text x="227.0" y="52" text-anchor="middle" font-weight="600">Set base files aside</text><text x="227.0" y="69" text-anchor="middle" font-size="11" fill="#59636e">test + new files stay</text>
<path d="M140 65H160" stroke="#59636e" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<rect x="314" y="30" width="130" height="70" rx="6" fill="#dbe7f3" stroke="#5b7fa6"/><text x="379.0" y="52" text-anchor="middle" font-weight="600">Run the test</text><text x="379.0" y="69" text-anchor="middle" font-size="11" fill="#59636e">must fail: red</text>
<path d="M292 65H312" stroke="#59636e" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<rect x="466" y="30" width="130" height="70" rx="6" fill="#dbe7f3" stroke="#5b7fa6"/><text x="531.0" y="52" text-anchor="middle" font-weight="600">Bring the fix back</text><text x="531.0" y="69" text-anchor="middle" font-size="11" fill="#59636e">the agent's changes</text>
<path d="M444 65H464" stroke="#59636e" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<rect x="618" y="30" width="130" height="70" rx="6" fill="#dbe7f3" stroke="#5b7fa6"/><text x="683.0" y="52" text-anchor="middle" font-weight="600">Run the test</text><text x="683.0" y="69" text-anchor="middle" font-size="11" fill="#59636e">must pass: green</text>
<path d="M596 65H616" stroke="#59636e" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<rect x="770" y="30" width="130" height="70" rx="6" fill="#dbe7f3" stroke="#5b7fa6"/><text x="835.0" y="52" text-anchor="middle" font-weight="600">Proven</text><text x="835.0" y="69" text-anchor="middle" font-size="11" fill="#59636e">on to the commands</text>
<path d="M748 65H768" stroke="#59636e" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<rect x="320" y="150" width="280" height="56" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-dasharray="4 3"/><text x="460.0" y="172" text-anchor="middle" font-weight="600">Stop, exit 1</text><text x="460.0" y="189" text-anchor="middle" font-size="11" fill="#59636e">report.json says which trial and why</text>
<path d="M381 100V128H420V148" stroke="#59636e" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<text x="372" y="122" text-anchor="end" font-size="11" fill="#59636e">passes</text>
<path d="M685 100V128H500V148" stroke="#59636e" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<text x="694" y="122" text-anchor="start" font-size="11" fill="#59636e">fails</text>
</g></svg>
