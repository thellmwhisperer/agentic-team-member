<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" width="900" height="140" role="img" aria-label="Configuration layers, each overriding the one before: built-in defaults (harness claude), then ~/.config/atm/config.yaml (harness, model, effort), then .atm.yaml at the repository root (every command and pattern, and optionally harness, model, effort), then the flags of one atm run (--harness, --model, --effort).">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9198a1"/></marker></defs>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3">
<text x="10" y="22" text-anchor="start" font-size="11" fill="#9198a1">Each layer overrides the one before</text>
<rect x="10" y="45" width="180" height="80" rx="6" fill="#1c2b3d" stroke="#7aa2d6"/><text x="100.0" y="67" text-anchor="middle" font-weight="600">Built-in defaults</text><text x="100.0" y="84" text-anchor="middle" font-size="11" fill="#9198a1">harness: claude</text>
<rect x="240" y="45" width="180" height="80" rx="6" fill="#1c2b3d" stroke="#7aa2d6"/><text x="330.0" y="67" text-anchor="middle" font-weight="600">~/.config/atm/config.yaml</text><text x="330.0" y="84" text-anchor="middle" font-size="11" fill="#9198a1">harness · model · effort</text><text x="330.0" y="99" text-anchor="middle" font-size="11" fill="#9198a1">your machine</text>
<rect x="470" y="45" width="180" height="80" rx="6" fill="#1c2b3d" stroke="#7aa2d6"/><text x="560.0" y="67" text-anchor="middle" font-weight="600">.atm.yaml</text><text x="560.0" y="84" text-anchor="middle" font-size="11" fill="#9198a1">every command and pattern</text><text x="560.0" y="99" text-anchor="middle" font-size="11" fill="#9198a1">+ harness · model · effort</text>
<rect x="700" y="45" width="180" height="80" rx="6" fill="#1c2b3d" stroke="#7aa2d6"/><text x="790.0" y="67" text-anchor="middle" font-weight="600">atm run flags</text><text x="790.0" y="84" text-anchor="middle" font-size="11" fill="#9198a1">--harness --model --effort</text><text x="790.0" y="99" text-anchor="middle" font-size="11" fill="#9198a1">one run</text>
<path d="M190 85H238" stroke="#9198a1" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M420 85H468" stroke="#9198a1" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M650 85H698" stroke="#9198a1" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
</g></svg>
