<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="The loop. An issue with a red test goes to an ATM run. FAIL goes back to the issue. PASS goes to the no-mistakes gate; its findings go to whoever launched the run, who answers them, then the gate opens a PR. A Low or Medium risk PR gets auto-merge; a High risk one waits for the risk-reviewed label. Merged on main, the issue closes.">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#59636e"/></marker></defs>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2328">
<rect x="10" y="40" width="130" height="62" rx="6" fill="#dbe7f3" stroke="#5b7fa6"/><text x="75.0" y="62" text-anchor="middle" font-weight="600">Issue</text><text x="75.0" y="79" text-anchor="middle" font-size="11" fill="#59636e">with a red test</text>
<rect x="180" y="40" width="100" height="62" rx="6" fill="#dbe7f3" stroke="#5b7fa6"/><text x="230.0" y="62" text-anchor="middle" font-weight="600">ATM run</text><text x="230.0" y="79" text-anchor="middle" font-size="11" fill="#59636e">atm run &lt;n&gt;</text>
<rect x="320" y="40" width="130" height="62" rx="6" fill="#dbe7f3" stroke="#5b7fa6"/><text x="385.0" y="62" text-anchor="middle" font-weight="600">no-mistakes gate</text><text x="385.0" y="79" text-anchor="middle" font-size="11" fill="#59636e">without --yes</text>
<rect x="490" y="40" width="80" height="62" rx="6" fill="#dbe7f3" stroke="#5b7fa6"/><text x="530.0" y="62" text-anchor="middle" font-weight="600">PR</text><text x="530.0" y="79" text-anchor="middle" font-size="11" fill="#59636e">risk assessed</text>
<rect x="625" y="40" width="100" height="62" rx="6" fill="#dbe7f3" stroke="#5b7fa6"/><text x="675.0" y="62" text-anchor="middle" font-weight="600">Auto-merge</text><text x="675.0" y="79" text-anchor="middle" font-size="11" fill="#59636e">once CI is green</text>
<rect x="760" y="40" width="130" height="62" rx="6" fill="#dbe7f3" stroke="#5b7fa6"/><text x="825.0" y="62" text-anchor="middle" font-weight="600">Merged on main</text><text x="825.0" y="79" text-anchor="middle" font-size="11" fill="#59636e">issue closed</text>
<path d="M140 71H178" stroke="#59636e" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M280 71H318" stroke="#59636e" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<text x="299" y="64" text-anchor="middle" font-size="11" fill="#59636e">PASS</text>
<path d="M450 71H488" stroke="#59636e" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M570 71H623" stroke="#59636e" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<text x="597" y="64" text-anchor="middle" font-size="10" fill="#59636e">Low/Med</text>
<path d="M725 71H758" stroke="#59636e" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M230 102V135H75V104" stroke="#59636e" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<text x="152" y="129" text-anchor="middle" font-size="11" fill="#59636e">FAIL: a better issue or check</text>
<rect x="290" y="165" width="185" height="56" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-dasharray="4 3"/><text x="382.5" y="187" text-anchor="middle" font-weight="600">Whoever launched the run</text><text x="382.5" y="204" text-anchor="middle" font-size="11" fill="#59636e">answers each finding</text>
<path d="M360 102V163" stroke="#59636e" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<text x="354" y="140" text-anchor="end" font-size="11" fill="#59636e">findings</text>
<path d="M410 165V104" stroke="#59636e" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<text x="416" y="140" text-anchor="start" font-size="11" fill="#59636e">answers</text>
<rect x="490" y="165" width="165" height="56" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-dasharray="4 3"/><text x="572.5" y="187" text-anchor="middle" font-weight="600">risk-reviewed label</text><text x="572.5" y="204" text-anchor="middle" font-size="11" fill="#59636e">after a Risk reviewed: comment</text>
<path d="M530 102V163" stroke="#59636e" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<text x="536" y="140" text-anchor="start" font-size="11" fill="#59636e">High</text>
<path d="M655 193H690V104" stroke="#59636e" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
</g></svg>
