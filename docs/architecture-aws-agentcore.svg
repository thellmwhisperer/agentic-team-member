<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1080" viewBox="0 0 1900 1080" role="img" aria-labelledby="title desc">
  <title id="title">ATM AWS AgentCore target architecture</title>
  <desc id="desc">An ATM job invokes an AWS AgentCore Runtime container. The container runs the canonical harness, calls Bedrock through a proxy, reads secrets, writes CloudWatch logs, optionally uses Roca Cloud, and has a dashed planned Gateway path for governed GitHub writes.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
    <marker id="dashed-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <style>
      .page-title { font: 700 46px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 21px Arial, sans-serif; fill: #475569; }
      .group-title { font: 700 18px Arial, sans-serif; fill: #334155; }
      .box-title { font: 700 24px Arial, sans-serif; fill: #111827; }
      .box-text { font: 400 18px Arial, sans-serif; fill: #334155; }
      .small { font: 400 16px Arial, sans-serif; fill: #475569; }
      .box { stroke-width: 3; rx: 20; filter: url(#shadow); }
      .job { fill: #f8fafc; stroke: #94a3b8; }
      .runtime { fill: #ecfdf5; stroke: #10b981; }
      .core { fill: #e0f2fe; stroke: #0284c7; }
      .bedrock { fill: #ccfbf1; stroke: #14b8a6; }
      .logs { fill: #fdf2f8; stroke: #db2777; }
      .secrets { fill: #fee2e2; stroke: #dc2626; }
      .memory { fill: #ede9fe; stroke: #7c3aed; }
      .ecr { fill: #ffedd5; stroke: #f97316; }
      .github { fill: #111827; stroke: #111827; }
      .github-title { font: 700 24px Arial, sans-serif; fill: #ffffff; }
      .github-text { font: 400 18px Arial, sans-serif; fill: #e5e7eb; }
      .solid { stroke: #334155; stroke-width: 4; fill: none; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .dashed { stroke: #64748b; stroke-width: 4; fill: none; stroke-dasharray: 12 10; marker-end: url(#dashed-arrow); stroke-linecap: round; stroke-linejoin: round; }
      .legend { font: 400 18px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1900" height="1080" fill="#ffffff"/>
  <text x="950" y="68" text-anchor="middle" class="page-title">ATM AWS AgentCore Target</text>
  <text x="950" y="106" text-anchor="middle" class="subtitle">Same harness; AWS supplies the runtime host, Bedrock model path, secrets, logs, and governed tool perimeter.</text>

  <rect x="70" y="145" width="1760" height="820" rx="34" fill="#eef6ff" stroke="#b6c8d8" stroke-width="3"/>
  <text x="105" y="190" class="group-title">AWS account / CDK managed resources</text>

  <rect x="120" y="260" width="265" height="125" class="box job"/>
  <text x="252.5" y="308" text-anchor="middle" class="box-title">ATM job</text>
  <text x="252.5" y="340" text-anchor="middle" class="box-text">repo + issue</text>
  <text x="252.5" y="366" text-anchor="middle" class="box-text">mode + run id</text>

  <rect x="120" y="600" width="265" height="125" class="box ecr"/>
  <text x="252.5" y="648" text-anchor="middle" class="box-title">ECR image</text>
  <text x="252.5" y="680" text-anchor="middle" class="box-text">built from</text>
  <text x="252.5" y="706" text-anchor="middle" class="box-text">monorepo root</text>

  <rect x="470" y="235" width="520" height="430" rx="26" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/>
  <text x="505" y="280" class="group-title">Bedrock AgentCore Runtime</text>

  <rect x="555" y="325" width="350" height="105" class="box runtime"/>
  <text x="730" y="368" text-anchor="middle" class="box-title">ATM container</text>
  <text x="730" y="398" text-anchor="middle" class="box-text">python -m runtime.atm_agent</text>

  <rect x="555" y="505" width="350" height="110" class="box core"/>
  <text x="730" y="550" text-anchor="middle" class="box-title">agentic_tdd_runner</text>
  <text x="730" y="582" text-anchor="middle" class="box-text">canonical harness</text>

  <rect x="1130" y="230" width="285" height="115" class="box bedrock"/>
  <text x="1272.5" y="276" text-anchor="middle" class="box-title">Bedrock proxy</text>
  <text x="1272.5" y="308" text-anchor="middle" class="box-text">OpenAI-compatible</text>

  <rect x="1510" y="230" width="235" height="115" class="box bedrock"/>
  <text x="1627.5" y="276" text-anchor="middle" class="box-title">Bedrock</text>
  <text x="1627.5" y="308" text-anchor="middle" class="box-text">Converse</text>

  <rect x="1130" y="415" width="285" height="115" class="box logs"/>
  <text x="1272.5" y="461" text-anchor="middle" class="box-title">CloudWatch Logs</text>
  <text x="1272.5" y="493" text-anchor="middle" class="box-text">runtime + harness</text>

  <rect x="1130" y="600" width="285" height="125" class="box secrets"/>
  <text x="1272.5" y="648" text-anchor="middle" class="box-title">Secrets Manager</text>
  <text x="1272.5" y="680" text-anchor="middle" class="box-text">GitHub token</text>
  <text x="1272.5" y="706" text-anchor="middle" class="box-text">optional Roca token</text>

  <rect x="555" y="780" width="350" height="120" class="box memory"/>
  <text x="730" y="827" text-anchor="middle" class="box-title">optional Roca Cloud MCP</text>
  <text x="730" y="859" text-anchor="middle" class="box-text">query context</text>
  <text x="730" y="885" text-anchor="middle" class="box-text">store handoff</text>

  <rect x="1510" y="455" width="235" height="125" class="box github"/>
  <text x="1627.5" y="503" text-anchor="middle" class="github-title">GitHub API</text>
  <text x="1627.5" y="535" text-anchor="middle" class="github-text">current direct</text>
  <text x="1627.5" y="561" text-anchor="middle" class="github-text">git push / PR</text>

  <rect x="1030" y="800" width="700" height="145" rx="24" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text x="1065" y="842" class="group-title">provisioned next path: governed GitHub tools</text>

  <rect x="1100" y="865" width="250" height="65" class="box memory"/>
  <text x="1225" y="891" text-anchor="middle" class="box-title">AgentCore Gateway</text>
  <text x="1225" y="916" text-anchor="middle" class="box-text">MCP + IAM</text>

  <rect x="1440" y="865" width="250" height="65" class="box ecr"/>
  <text x="1565" y="891" text-anchor="middle" class="box-title">GitHub Lambda</text>
  <text x="1565" y="916" text-anchor="middle" class="box-text">allowlist + branch guard</text>

  <path class="solid" d="M385,322 H470"/>
  <path class="dashed" d="M385,662 H430 V395 H555"/>
  <path class="solid" d="M730,430 V505"/>
  <path class="solid" d="M905,520 H1015 V288 H1130"/>
  <path class="solid" d="M1415,288 H1510"/>
  <path class="solid" d="M905,377 H1085 V472 H1130"/>
  <path class="solid" d="M905,590 H1085 V662 H1130"/>
  <path class="solid" d="M730,615 V780"/>
  <path class="solid" d="M905,560 H1450 V518 H1510"/>
  <path class="dashed" d="M905,615 H990 V897 H1100"/>
  <path class="dashed" d="M1350,897 H1440"/>
  <path class="dashed" d="M1565,865 V635 H1627 V580"/>

  <rect x="120" y="815" width="300" height="105" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="150" y1="850" x2="225" y2="850" stroke="#334155" stroke-width="4"/>
  <text x="245" y="856" class="legend">supported today</text>
  <line x1="150" y1="895" x2="225" y2="895" stroke="#64748b" stroke-width="4" stroke-dasharray="12 10"/>
  <text x="245" y="901" class="legend">provisioned next path</text>
</svg>
