<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1120" viewBox="0 0 1900 1120" role="img" aria-labelledby="title desc">
  <title id="title">ATM AWS AgentCore Target Architecture</title>
  <desc id="desc">An ATM job invokes an AWS AgentCore Runtime container that runs the canonical harness, calls Bedrock through a proxy, reads secrets, writes CloudWatch logs, optionally uses Roca Cloud, and has a planned Gateway path for governed GitHub writes.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
    <marker id="dashedArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 700 46px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 22px Arial, sans-serif; fill: #475569; }
      .label { font: 700 24px Arial, sans-serif; fill: #111827; }
      .small { font: 400 18px Arial, sans-serif; fill: #334155; }
      .tiny { font: 400 16px Arial, sans-serif; fill: #475569; }
      .box { stroke-width: 3; rx: 22; filter: url(#shadow); }
      .solid { stroke: #334155; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #64748b; stroke-width: 4; fill: none; stroke-dasharray: 13 11; marker-end: url(#dashedArrow); }
      .job { fill: #f8fafc; stroke: #94a3b8; }
      .runtime { fill: #ecfdf5; stroke: #10b981; }
      .core { fill: #e0f2fe; stroke: #0284c7; }
      .bedrock { fill: #ccfbf1; stroke: #14b8a6; }
      .logs { fill: #fdf2f8; stroke: #db2777; }
      .secrets { fill: #fee2e2; stroke: #dc2626; }
      .memory { fill: #ede9fe; stroke: #7c3aed; }
      .ecr { fill: #ffedd5; stroke: #f97316; }
      .github { fill: #111827; stroke: #111827; }
      .githubText { font: 700 24px Arial, sans-serif; fill: #ffffff; }
      .githubSmall { font: 400 18px Arial, sans-serif; fill: #e5e7eb; }
      .gatewayGroup { fill: #fff7ed; stroke: #fb923c; stroke-width: 3; rx: 28; }
      .caption { font: 700 18px Arial, sans-serif; fill: #334155; }
      .legendLine { stroke: #334155; stroke-width: 4; }
      .legendDash { stroke: #64748b; stroke-width: 4; stroke-dasharray: 13 11; }
    </style>
  </defs>

  <rect width="1900" height="1120" fill="#ffffff"/>
  <text x="950" y="70" text-anchor="middle" class="title">ATM AWS AgentCore Target</text>
  <text x="950" y="110" text-anchor="middle" class="subtitle">Same canonical harness; AWS supplies the host, Bedrock model path, secrets, logs, and governed tool perimeter.</text>

  <rect x="70" y="155" width="1760" height="820" rx="36" fill="#eef6ff" stroke="#b6c8d8" stroke-width="3"/>
  <text x="105" y="202" class="caption">AWS account / CDK managed resources</text>

  <rect x="120" y="275" width="270" height="130" class="box job"/>
  <text x="255" y="325" text-anchor="middle" class="label">ATM job</text>
  <text x="255" y="358" text-anchor="middle" class="small">repo + issue</text>
  <text x="255" y="384" text-anchor="middle" class="small">mode + run id</text>

  <rect x="120" y="620" width="270" height="130" class="box ecr"/>
  <text x="255" y="670" text-anchor="middle" class="label">ECR image</text>
  <text x="255" y="702" text-anchor="middle" class="small">built from</text>
  <text x="255" y="728" text-anchor="middle" class="small">monorepo root</text>

  <rect x="500" y="245" width="520" height="430" rx="26" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/>
  <text x="535" y="292" class="caption">Bedrock AgentCore Runtime</text>

  <rect x="570" y="345" width="380" height="120" class="box runtime"/>
  <text x="760" y="392" text-anchor="middle" class="label">ATM container</text>
  <text x="760" y="423" text-anchor="middle" class="small">python -m runtime.atm_agent</text>

  <rect x="570" y="520" width="380" height="120" class="box core"/>
  <text x="760" y="567" text-anchor="middle" class="label">agentic_tdd_runner</text>
  <text x="760" y="598" text-anchor="middle" class="small">canonical harness</text>

  <rect x="1125" y="310" width="290" height="125" class="box bedrock"/>
  <text x="1270" y="360" text-anchor="middle" class="label">Bedrock proxy</text>
  <text x="1270" y="392" text-anchor="middle" class="small">OpenAI-compatible</text>

  <rect x="1530" y="300" width="245" height="130" class="box bedrock"/>
  <text x="1652" y="350" text-anchor="middle" class="label">Bedrock</text>
  <text x="1652" y="382" text-anchor="middle" class="small">Converse</text>

  <rect x="1125" y="505" width="290" height="125" class="box logs"/>
  <text x="1270" y="555" text-anchor="middle" class="label">CloudWatch</text>
  <text x="1270" y="587" text-anchor="middle" class="small">runtime + harness logs</text>

  <rect x="1125" y="700" width="290" height="125" class="box secrets"/>
  <text x="1270" y="750" text-anchor="middle" class="label">Secrets Manager</text>
  <text x="1270" y="782" text-anchor="middle" class="small">GitHub token</text>
  <text x="1270" y="808" text-anchor="middle" class="small">optional Roca token</text>

  <rect x="570" y="785" width="380" height="125" class="box memory"/>
  <text x="760" y="835" text-anchor="middle" class="label">optional Roca Cloud MCP</text>
  <text x="760" y="867" text-anchor="middle" class="small">pre-run context</text>
  <text x="760" y="893" text-anchor="middle" class="small">post-run handoff</text>

  <rect x="1530" y="535" width="245" height="130" class="box github"/>
  <text x="1652" y="583" text-anchor="middle" class="githubText">GitHub API</text>
  <text x="1652" y="615" text-anchor="middle" class="githubSmall">current direct</text>
  <text x="1652" y="640" text-anchor="middle" class="githubSmall">git push / PR</text>

  <rect x="1035" y="850" width="740" height="190" class="gatewayGroup"/>
  <text x="1070" y="895" class="caption">provisioned governed GitHub tools</text>

  <rect x="1095" y="925" width="270" height="80" class="box memory"/>
  <text x="1230" y="959" text-anchor="middle" class="label">AgentCore Gateway</text>
  <text x="1230" y="985" text-anchor="middle" class="small">MCP + IAM</text>

  <rect x="1465" y="925" width="250" height="80" class="box ecr"/>
  <text x="1590" y="959" text-anchor="middle" class="label">GitHub Lambda</text>
  <text x="1590" y="985" text-anchor="middle" class="small">allowlist + branch guard</text>

  <path class="solid" d="M 390 340 C 430 340 455 395 500 395"/>
  <path class="dashed" d="M 390 685 C 430 685 455 450 570 405"/>
  <path class="solid" d="M 760 465 V 520"/>
  <path class="solid" d="M 950 580 C 1025 580 1030 372 1125 372"/>
  <path class="solid" d="M 1415 372 H 1530"/>
  <path class="solid" d="M 950 405 C 1040 405 1030 760 1125 760"/>
  <path class="solid" d="M 950 430 C 1025 430 1030 565 1125 565"/>
  <path class="solid" d="M 760 640 V 785"/>
  <path class="solid" d="M 950 590 C 1110 620 1310 600 1530 600"/>
  <path class="dashed" d="M 950 545 C 1030 650 1070 830 1120 925"/>
  <path class="dashed" d="M 1365 965 H 1465"/>
  <path class="dashed" d="M 1590 925 C 1600 800 1640 740 1650 665"/>

  <text x="445" y="326" text-anchor="middle" class="tiny">invoke</text>
  <text x="438" y="650" text-anchor="middle" class="tiny">image at deploy</text>
  <text x="1035" y="350" text-anchor="middle" class="tiny">chat</text>
  <text x="1472" y="350" text-anchor="middle" class="tiny">InvokeModel</text>
  <text x="1040" y="735" text-anchor="middle" class="tiny">GetSecretValue</text>
  <text x="1005" y="805" text-anchor="middle" class="tiny">query/store</text>
  <text x="1390" y="582" text-anchor="middle" class="tiny">current PR path</text>
  <text x="1420" y="910" text-anchor="middle" class="tiny">planned governed writes</text>

  <rect x="120" y="835" width="300" height="100" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="150" y1="870" x2="225" y2="870" class="legendLine"/>
  <text x="245" y="876" class="small">supported today</text>
  <line x1="150" y1="910" x2="225" y2="910" class="legendDash"/>
  <text x="245" y="916" class="small">provisioned next path</text>
</svg>
