commands:
  test: scripts/test.sh
  lint: scripts/lint.sh
review:
  path_instructions:
    - path: "**"
      instructions: |
        Run tests through `scripts/test.sh` (`go test ./...`) and lint through `scripts/lint.sh`.
        A finding is a defect against the linked issue's acceptance criteria, or one that breaks the
        repository's test, typecheck or lint commands. Hardening for a case the issue does not name is
        reported as a note and changes nothing.
auto_fix:
  review: 0  # the reviewer only reports; the agent that launched ATM answers every finding (Javi, 5-oct-2026)
ci:
  rerun_transient: 1  # a check GitHub cancels without a verdict (no runner in 15 min, PR 131) is re-run once before anyone is asked
