# No test command: the gate's Test step is targeted at the change; the whole suite runs in ATM's Checks and in CI.
commands:
  lint: scripts/lint.sh
review:
  path_instructions:
    - path: "**"
      instructions: |
        Run the tests of the packages the change touches (`go test`), never the whole suite, and lint through
        `scripts/lint.sh`.
        A finding is a defect against the linked issue's acceptance criteria, or one that breaks the
        repository's test, typecheck or lint commands. Hardening for a case the issue does not name is
        reported as a note and changes nothing.
auto_fix:
  review: 0  # the reviewer only reports; the agent that launched ATM answers every finding (the maintainer, 5-oct-2026)
ci:
  rerun_transient: 1  # a check GitHub cancels without a verdict (no runner in 15 min, PR 131) is re-run once before anyone is asked
