install: go mod download
test: scripts/test.sh
e2e: scripts/cover-diff.sh
typecheck: go vet ./...
lint: scripts/lint.sh
test_file: go test -count=1 -timeout 30m -run {tests} {dir}
test_patterns: ["**/*_test.go", "tests/**"]
docs_patterns: ["**/*.md", "docs/**"]
delivery: 'no-mistakes init && no-mistakes axi run --intent "$ATM_INTENT"'
agent_timeout: 60m
check_timeout: 20m
